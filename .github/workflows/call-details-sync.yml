name: call-details-sync

on:
  schedule:
    - cron: "30 16 * * *"   # 06:30 HST: yesterday and the day before
    - cron: "30 4 * * *"    # 18:30 HST: catch late arriving call data
  workflow_dispatch:
    inputs:
      date:
        description: "One day, YYYY-MM-DD (leave empty to use from/to or the default window)"
        required: false
        default: ""
      from:
        description: "Range start, YYYY-MM-DD (backfill)"
        required: false
        default: ""
      to:
        description: "Range end, YYYY-MM-DD"
        required: false
        default: ""
      dry_run:
        description: "Print rows only, do not write to Supabase"
        type: boolean
        required: false
        default: false

concurrency:
  group: call-details-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GADS_REPORT_URL: ${{ secrets.GADS_REPORT_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GADS_ACCOUNT_TZ: ${{ vars.GADS_ACCOUNT_TZ || 'Pacific/Honolulu' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore browser session from GADS_STORAGE_STATE
        env:
          GADS_STORAGE_STATE: ${{ secrets.GADS_STORAGE_STATE }}
        run: |
          set +x
          if [ -z "$GADS_STORAGE_STATE" ]; then
            echo "::error::secret GADS_STORAGE_STATE is empty; run scripts/login_once.py and add it"
            mkdir -p debug && echo SESSION_EXPIRED > debug/error_code.txt
            exit 1
          fi
          printf '%s' "$GADS_STORAGE_STATE" | tr -d '\n\r ' | base64 -d > storage_state.json
          python - <<'PY'
          import json, sys
          try:
              d = json.load(open("storage_state.json"))
              assert isinstance(d.get("cookies"), list)
          except Exception as e:
              print("::error::GADS_STORAGE_STATE is not a valid Playwright storage state (base64 of storage_state.json):", type(e).__name__)
              import os; os.makedirs("debug", exist_ok=True); open("debug/error_code.txt", "w").write("SESSION_EXPIRED")
              sys.exit(1)
          print(f"storage state restored: {len(d['cookies'])} cookie(s)")
          PY

      - name: Build arguments
        id: args
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
          [ -n "$IN_FROM" ] && ARGS="$ARGS --from $IN_FROM"
          [ -n "$IN_TO" ] && ARGS="$ARGS --to $IN_TO"
          [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "running with:$ARGS"

      - name: Sync call details
        run: python -m src.run ${{ steps.args.outputs.args }}

      - name: Remove session file
        if: always()
        run: rm -f storage_state.json

      - name: Upload debug output (screenshots contain phone numbers; repo must stay private)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert webhook
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$ALERT_WEBHOOK_URL" ] && { echo "ALERT_WEBHOOK_URL not set; relying on GitHub failure email"; exit 0; }
          CODE=$(tr -cd 'A-Z_' < debug/error_code.txt 2>/dev/null || true)
          CODE=${CODE:-UNKNOWN}
          MSG="call-details-sync failed: $CODE ($RUN_URL)"
          curl -sS -m 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$MSG\",\"content\":\"$MSG\",\"error_code\":\"$CODE\",\"run_url\":\"$RUN_URL\"}" \
            "$ALERT_WEBHOOK_URL" || echo "alert webhook failed (ignored)"
