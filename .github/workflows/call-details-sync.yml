name: call-details-sync

on:
  schedule:
    - cron: "30 16 * * *"   # 06:30 HST: yesterday and the day before
    - cron: "30 4 * * *"    # 18:30 HST: catch late arriving call data
  workflow_dispatch:
    inputs:
      date:
        description: "One day, YYYY-MM-DD (leave empty to use from/to or the default window)"
        required: false
        default: ""
      from:
        description: "Range start, YYYY-MM-DD (backfill)"
        required: false
        default: ""
      to:
        description: "Range end, YYYY-MM-DD"
        required: false
        default: ""
      dry_run:
        description: "Print rows only, do not write to Supabase"
        type: boolean
        required: false
        default: false

concurrency:
  group: call-details-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Set the repository variable RUNNER_LABEL (e.g. "self-hosted") to run on your own
    # machine if Google blocks sign-ins from GitHub's datacenter IPs. No code change needed.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      GADS_EMAIL: ${{ secrets.GADS_EMAIL }}
      GADS_PASSWORD: ${{ secrets.GADS_PASSWORD }}
      GADS_TOTP_SECRET: ${{ secrets.GADS_TOTP_SECRET }}
      GADS_SESSION: ${{ secrets.GADS_SESSION }}
      GADS_PROXY_URL: ${{ secrets.GADS_PROXY_URL }}
      GADS_REPORT_URL: ${{ secrets.GADS_REPORT_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GADS_ACCOUNT_TZ: ${{ vars.GADS_ACCOUNT_TZ || 'America/Los_Angeles' }}
      GADS_PROFILE_DIR: ${{ vars.GADS_PROFILE_DIR || '.chrome-profile' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Preflight (secrets present, repo visibility)
        id: preflight
        env:
          IS_DRY: ${{ github.event.inputs.dry_run }}
          REPO_PRIVATE_EVENT: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          for v in GADS_EMAIL GADS_PASSWORD GADS_TOTP_SECRET; do
            [ -n "${!v}" ] && echo "::add-mask::${!v}"
          done
          [ -n "$GADS_EMAIL" ] && echo "::add-mask::${GADS_EMAIL%%@*}"
          MISSING=""
          [ -z "$GADS_REPORT_URL" ] && MISSING="$MISSING GADS_REPORT_URL"
          if [ -n "$GADS_SESSION" ]; then
            echo "auth: saved session (GADS_SESSION) first, credentials as fallback: $([ -n "$GADS_EMAIL" ] && [ -n "$GADS_PASSWORD" ] && echo yes || echo no)"
          else
            echo "auth: no GADS_SESSION, self sign-in with credentials"
            for v in GADS_EMAIL GADS_PASSWORD; do
              [ -z "${!v}" ] && MISSING="$MISSING $v"
            done
          fi
          [ -z "$GADS_TOTP_SECRET" ] && echo "::warning::GADS_TOTP_SECRET is empty: a sign-in fails with LOGIN_TOTP_MISSING if Google asks for an authenticator code"
          [ -n "$GADS_PROXY_URL" ] && echo "proxy: GADS_PROXY_URL is set" || echo "proxy: none"
          if [ "$IS_DRY" != "true" ]; then
            for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
              [ -z "${!v}" ] && MISSING="$MISSING $v"
            done
          fi
          # repo visibility: from the event payload when present, else from the API
          PRIV="$REPO_PRIVATE_EVENT"
          if [ -z "$PRIV" ]; then
            PRIV=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("private","")).lower())' 2>/dev/null || echo "")
          fi
          echo "private=$PRIV" >> "$GITHUB_OUTPUT"
          echo "repository private: ${PRIV:-unknown}"
          if [ "$PRIV" != "true" ]; then
            echo "::warning::repository is not private: debug artifacts and the Chrome profile cache are disabled, phone numbers are masked in logs"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::missing secrets:$MISSING (add them under Settings > Secrets and variables > Actions)"
            mkdir -p debug && echo MISSING_SECRETS > debug/error_code.txt
            echo "error_code=MISSING_SECRETS" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "all required secrets are set"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Chrome version
        run: google-chrome --version || chromium --version || echo "no system Chrome found; Selenium Manager will try to fetch one"

      # The Chrome profile holds Google cookies, so it is cached only when the repo is private.
      # Restoring a profile from the previous run avoids a fresh login (and new-device checks) every day.
      - name: Restore Chrome profile from cache
        if: steps.preflight.outputs.private == 'true' && env.GADS_PROFILE_DIR == '.chrome-profile'
        uses: actions/cache/restore@v4
        with:
          path: .chrome-profile
          key: chrome-profile-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            chrome-profile-v1-${{ runner.os }}-

      - name: Build arguments
        id: args
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
          [ -n "$IN_FROM" ] && ARGS="$ARGS --from $IN_FROM"
          [ -n "$IN_TO" ] && ARGS="$ARGS --to $IN_TO"
          [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "running with:$ARGS"

      - name: Sync call details
        run: python -m src.run ${{ steps.args.outputs.args }}

      - name: Trim Chrome profile before caching
        if: always() && steps.preflight.outputs.private == 'true' && env.GADS_PROFILE_DIR == '.chrome-profile'
        run: |
          [ -d .chrome-profile ] || exit 0
          rm -rf .chrome-profile/Singleton* .chrome-profile/Crashpad .chrome-profile/BrowserMetrics* \
                 .chrome-profile/GrShaderCache .chrome-profile/ShaderCache .chrome-profile/GraphiteDawnCache \
                 .chrome-profile/Default/Cache .chrome-profile/Default/"Code Cache" .chrome-profile/Default/GPUCache \
                 .chrome-profile/Default/"Service Worker" .chrome-profile/Default/DawnCache .chrome-profile/Default/DawnWebGPUCache \
                 .chrome-profile/Default/"Session Storage" .chrome-profile/Default/optimization_guide* 2>/dev/null || true
          du -sh .chrome-profile || true

      - name: Save Chrome profile to cache
        if: always() && steps.preflight.outputs.private == 'true' && env.GADS_PROFILE_DIR == '.chrome-profile'
        uses: actions/cache/save@v4
        with:
          path: .chrome-profile
          key: chrome-profile-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Remove downloads and profile from the runner
        if: always()
        run: rm -rf downloads .chrome-profile out

      - name: Upload debug output (private repos only; screenshots can contain phone numbers)
        if: failure() && steps.preflight.outputs.private == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert webhook
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CODE=$(tr -cd 'A-Z_' < debug/error_code.txt 2>/dev/null || true)
          CODE=${CODE:-UNKNOWN}
          echo "failure code: $CODE"
          [ -z "$ALERT_WEBHOOK_URL" ] && { echo "ALERT_WEBHOOK_URL not set; relying on GitHub failure email"; exit 0; }
          MSG="call-details-sync failed: $CODE ($RUN_URL)"
          curl -sS -m 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$MSG\",\"content\":\"$MSG\",\"error_code\":\"$CODE\",\"run_url\":\"$RUN_URL\"}" \
            "$ALERT_WEBHOOK_URL" || echo "alert webhook failed (ignored)"
