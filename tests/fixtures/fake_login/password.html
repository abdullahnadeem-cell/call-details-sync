<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in - Google Accounts</title><script src="common.js"></script></head>
<body>
<h1>Welcome</h1>
<div id="who"></div>
<input type="password" name="Passwd" aria-label="Enter your password" placeholder="Enter your password">
<div id="err" style="display:none;color:red"></div>
<button id="next">Next</button>
<script>
document.getElementById("who").textContent = sessionStorage.getItem("email") || "";
document.getElementById("next").onclick = () => {
  const v = document.querySelector('input[name=Passwd]').value;
  if (MODE === "badpass" || v !== "correct horse") return showError("err", "Wrong password. Try again or click Forgot password to reset it.");
  if (MODE === "challenge") return go("challenge.html");
  if (MODE === "tap") return go("tap.html");
  if (MODE === "pwonly") return go("skip.html");
  go("totp.html");
};
</script></body></html>
